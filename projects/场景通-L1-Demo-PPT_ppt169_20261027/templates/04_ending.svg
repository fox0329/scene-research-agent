<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720" width="1280" height="720">
  <!-- Ending: 全幅背景 + 左侧蓝色渐变遮罩 + 居中白色口号（literal 还原 slide24；源遮罩为红 #A21317，按蓝色模版规整为 #1D2A8C） -->

  <defs>
    <!-- 左侧遮罩渐变（左不透明 → 右透明），用于压暗背景图左侧以保证白字可读 -->
    <linearGradient id="endScrim" x1="0" y1="0.5" x2="1" y2="0.5">
      <stop offset="0" stop-color="#1D2A8C" stop-opacity="0.48"/>
      <stop offset="1" stop-color="#1D2A8C" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- 背景：结尾品牌图全幅 -->
  <g id="bg">
    <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
    <image href="assets/image2.jpeg" x="0" y="0" width="1280" height="720" preserveAspectRatio="xMidYMid slice"/>
  </g>

  <!-- 左侧蓝色渐变遮罩 -->
  <g id="scrim">
    <rect x="0" y="0" width="801.33" height="720" fill="url(#endScrim)"/>
  </g>

  <!-- 居中白色口号 -->
  <g id="slogan">
    <text x="640" y="360" text-anchor="middle" font-family="微软雅黑, &quot;Microsoft YaHei&quot;, sans-serif" font-size="44" font-weight="bold" fill="#FFFFFF" letter-spacing="10">{{SLOGAN}}</text>
    <text x="640" y="420" text-anchor="middle" font-family="微软雅黑, &quot;Microsoft YaHei&quot;, sans-serif" font-size="24" fill="#FFFFFF">{{SLOGAN_SUB}}</text>
  </g>
</svg>
