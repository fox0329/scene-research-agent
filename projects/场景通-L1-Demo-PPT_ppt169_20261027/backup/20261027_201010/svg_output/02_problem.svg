<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720" width="1280" height="720">
  <g id="bg">
    <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  </g>

  <g id="chrome">
    <rect x="0.09" y="37.64" width="22.74" height="34.02" fill="#1D2A8C"/>
    <rect x="16.73" y="33.4" width="11.34" height="11.34" fill="#22943A"/>
    <image href="../images/logo.png" x="1109.97" y="18.73" width="123.36" height="51.68" preserveAspectRatio="xMidYMid meet"/>
    <text x="52.24" y="62.12" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="32" font-weight="bold" fill="#1D2A8C">一个场景，先卡在找资料</text>
    <text x="52" y="100" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" fill="#6B7280">方案慢，不是写不出来，是调研阶段找不全、说不清</text>
  </g>

  <g id="card-1">
    <rect x="52" y="156" width="368" height="300" rx="12" fill="#F9FAFB" stroke="#D6E7F8" stroke-width="1"/>
    <rect x="52" y="156" width="368" height="5" rx="2" fill="#0070C0"/>
    <use data-icon="tabler-outline/database" x="76" y="184" width="28" height="28" fill="#0070C0" stroke-width="2"/>
    <text x="400" y="198" text-anchor="end" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="15" font-weight="bold" fill="#6B7280">01</text>
    <text x="76" y="252" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="24" font-weight="bold" fill="#1D2A8C">材料散</text>
    <text x="76" y="292" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="17" fill="#404040">邮件、网盘、聊天记录</text>
    <text x="76" y="324" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="17" fill="#404040">找齐要半天，版本还对不上</text>
    <text x="76" y="386" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" fill="#6B7280">先花时间找，才开始判断</text>
  </g>

  <g id="card-2">
    <rect x="444" y="156" width="368" height="300" rx="12" fill="#F9FAFB" stroke="#D6E7F8" stroke-width="1"/>
    <rect x="444" y="156" width="368" height="5" rx="2" fill="#0070C0"/>
    <use data-icon="tabler-outline/route" x="468" y="184" width="28" height="28" fill="#0070C0" stroke-width="2"/>
    <text x="792" y="198" text-anchor="end" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="15" font-weight="bold" fill="#6B7280">02</text>
    <text x="468" y="252" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="24" font-weight="bold" fill="#1D2A8C">维度漏</text>
    <text x="468" y="292" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="17" fill="#404040">合规、竞争、交付边界</text>
    <text x="468" y="324" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="17" fill="#404040">没人提醒就漏，返工才发现</text>
    <text x="468" y="386" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" fill="#6B7280">漏一项，方案就要重来</text>
  </g>

  <g id="card-3">
    <rect x="836" y="156" width="368" height="300" rx="12" fill="#F9FAFB" stroke="#D6E7F8" stroke-width="1"/>
    <rect x="836" y="156" width="368" height="5" rx="2" fill="#0070C0"/>
    <use data-icon="tabler-outline/file-text" x="860" y="184" width="28" height="28" fill="#0070C0" stroke-width="2"/>
    <text x="1184" y="198" text-anchor="end" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="15" font-weight="bold" fill="#6B7280">03</text>
    <text x="860" y="252" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="24" font-weight="bold" fill="#1D2A8C">来源虚</text>
    <text x="860" y="292" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="17" fill="#404040">客户一问数字，答不上来</text>
    <text x="860" y="324" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="17" fill="#404040">结论站不住，汇报没底气</text>
    <text x="860" y="386" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" fill="#6B7280">不是不会写，是不敢下判断</text>
  </g>

  <g id="bottom-stat">
    <text x="52" y="548" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" fill="#6B7280">从调研到方案</text>
    <text x="52" y="604" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="56" font-weight="bold" fill="#0070C0">1–2 周</text>
    <line x1="360" y1="520" x2="360" y2="612" stroke="#D6E7F8" stroke-width="1"/>
    <text x="400" y="552" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="20" font-weight="bold" fill="#0D0D0D">不是写方案慢，是前期调研慢</text>
    <text x="400" y="586" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" fill="#404040">方案只是最后一步；前面找资料、补维度、核来源，才是大头。</text>
  </g>

  <g id="footer">
    <rect x="0" y="656" width="1280" height="64" fill="#0070C0"/>
    <text x="52" y="694" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="18" fill="#FFFFFF">先把调研这件事，变成一条可复用的流程。</text>
    <text x="1228" y="694" text-anchor="end" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="14" fill="#FFFFFF" fill-opacity="0.8">02 / 10</text>
  </g>
</svg>
