<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720" width="1280" height="720">
  <g id="bg">
    <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  </g>

  <g id="chrome">
    <rect x="0.09" y="37.64" width="22.74" height="34.02" fill="#1D2A8C"/>
    <rect x="16.73" y="33.4" width="11.34" height="11.34" fill="#22943A"/>
    <image href="../images/logo.png" x="1109.97" y="18.73" width="123.36" height="51.68" preserveAspectRatio="xMidYMid meet"/>
    <text x="52.24" y="62.12" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="32" font-weight="bold" fill="#1D2A8C">产品资料一次入库，跨场景复用</text>
    <text x="52" y="100" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" fill="#6B7280">资料不是每次重新收集，而是一次入库、统一维护</text>
  </g>

  <g id="left-text">
    <use data-icon="tabler-outline/database" x="52" y="152" width="30" height="30" fill="#0070C0" stroke-width="2"/>
    <text x="94" y="176" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" font-weight="bold" fill="#6B7280">产品资料库</text>

    <text x="52" y="236" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="20" fill="#404040">产品清单、规格书、能力、边界、案例</text>
    <line x1="52" y1="258" x2="560" y2="258" stroke="#D6E7F8" stroke-width="1"/>
    <text x="52" y="300" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="20" fill="#404040">AI 解析成结构化条目，不用手工拆</text>
    <line x1="52" y1="322" x2="560" y2="322" stroke="#D6E7F8" stroke-width="1"/>
    <text x="52" y="364" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="20" fill="#404040">一次导入，统一维护；新建场景直接引用</text>

    <rect x="52" y="408" width="500" height="112" rx="10" fill="#F9FAFB" stroke="#D6E7F8" stroke-width="1"/>
    <rect x="52" y="408" width="4" height="112" rx="2" fill="#22943A"/>
    <text x="76" y="444" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="18" font-weight="bold" fill="#1D2A8C">不是每次重新收集，也不是每次重新对齐版本。</text>
    <text x="76" y="476" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" fill="#404040">产品资料是共用底座，场景只引用自己需要的那部分。</text>
    <text x="76" y="502" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" fill="#6B7280">资料变了，场景里重新引用即可。</text>
  </g>

  <g id="library-shot">
    <rect x="636" y="140" width="564" height="330" rx="8" fill="#F9FAFB" stroke="#D6E7F8" stroke-width="1"/>
    <image href="../images/P4-library.png" x="640" y="144" width="556" height="313" preserveAspectRatio="xMidYMid meet"/>
    <text x="640" y="124" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1D2A8C">产品资料库：产品线 / 产品清单 / 状态</text>
  </g>

  <g id="library-detail">
    <rect x="752" y="318" width="456" height="286" rx="8" fill="#FFFFFF" stroke="#0070C0" stroke-width="2"/>
    <image href="../images/P4-library-detail.png" x="758" y="324" width="444" height="274" preserveAspectRatio="xMidYMid meet"/>
    <text x="758" y="630" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" fill="#6B7280">AI 解析后的结构化条目：名称、型号、状态、资料数量</text>
  </g>

  <g id="footer">
    <rect x="0" y="656" width="1280" height="64" fill="#0070C0"/>
    <text x="52" y="694" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" fill="#FFFFFF">一次导入，统一维护；新建场景直接引用。</text>
    <text x="1228" y="694" text-anchor="end" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="14" fill="#FFFFFF" fill-opacity="0.8">04 / 10</text>
  </g>
</svg>
