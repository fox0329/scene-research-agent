<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720" width="1280" height="720">
  <g id="bg">
    <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  </g>

  <g id="chrome">
    <rect x="0.09" y="37.64" width="22.74" height="34.02" fill="#1D2A8C"/>
    <rect x="16.73" y="33.4" width="11.34" height="11.34" fill="#22943A"/>
    <image href="../images/logo.png" x="1109.97" y="18.73" width="123.36" height="51.68" preserveAspectRatio="xMidYMid meet"/>
    <text x="52.24" y="62.12" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="32" font-weight="bold" fill="#1D2A8C">从表格到可讲的文件</text>
    <text x="52" y="100" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" fill="#6B7280">解决方案和 PPT 大纲同一次生成；改完，直接导出</text>
  </g>

  <g id="card-1">
    <rect x="52" y="140" width="368" height="430" rx="12" fill="#F9FAFB" stroke="#D6E7F8" stroke-width="1"/>
    <rect x="52" y="140" width="368" height="5" rx="2" fill="#0070C0"/>
    <text x="76" y="186" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="22" font-weight="bold" fill="#1D2A8C">解决方案</text>
    <text x="76" y="210" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#6B7280">有章节 · 有来源 · 有边界</text>
    <rect x="76" y="232" width="320" height="190" rx="6" fill="#FFFFFF" stroke="#D6E7F8" stroke-width="1"/>
    <image href="../images/P8-solution.png" x="80" y="236" width="312" height="182" preserveAspectRatio="xMidYMid meet"/>
    <text x="76" y="456" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" fill="#404040">从现状、问题到建设目标，</text>
    <text x="76" y="480" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" fill="#404040">正文可编辑，来源在右栏。</text>
    <line x1="76" y1="512" x2="396" y2="512" stroke="#D6E7F8" stroke-width="1"/>
    <text x="76" y="542" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#6B7280">不是空模板，是按 26 张表收口出来的正文。</text>
  </g>

  <g id="card-2">
    <rect x="444" y="140" width="368" height="430" rx="12" fill="#F9FAFB" stroke="#D6E7F8" stroke-width="1"/>
    <rect x="444" y="140" width="368" height="5" rx="2" fill="#0070C0"/>
    <text x="468" y="186" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="22" font-weight="bold" fill="#1D2A8C">PPT 大纲</text>
    <text x="468" y="210" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#6B7280">按正文展开 · 可直接改</text>
    <rect x="468" y="232" width="320" height="190" rx="6" fill="#FFFFFF" stroke="#D6E7F8" stroke-width="1"/>
    <image href="../images/P8-outline.png" x="472" y="236" width="312" height="182" preserveAspectRatio="xMidYMid meet"/>
    <text x="468" y="456" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" fill="#404040">大纲按方案正文展开，</text>
    <text x="468" y="480" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" fill="#404040">页标题、要点都能改。</text>
    <line x1="468" y1="512" x2="788" y2="512" stroke="#D6E7F8" stroke-width="1"/>
    <text x="468" y="542" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#6B7280">不是另写一份 PPT，是从同一套结论里长出来。</text>
  </g>

  <g id="card-3">
    <rect x="836" y="140" width="368" height="430" rx="12" fill="#F9FAFB" stroke="#D6E7F8" stroke-width="1"/>
    <rect x="836" y="140" width="368" height="5" rx="2" fill="#0070C0"/>
    <text x="860" y="186" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="22" font-weight="bold" fill="#1D2A8C">导出</text>
    <text x="860" y="210" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#6B7280">Word / PPT / Markdown</text>
    <rect x="860" y="246" width="320" height="80" rx="6" fill="#FFFFFF" stroke="#D6E7F8" stroke-width="1"/>
    <image href="../images/P8-export.png" x="866" y="262" width="308" height="48" preserveAspectRatio="xMidYMid meet"/>
    <rect x="860" y="348" width="320" height="42" rx="6" fill="#0070C0"/>
    <text x="1020" y="375" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF">导出 PPT 文档</text>
    <text x="860" y="428" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" fill="#404040">确认后直接导出，</text>
    <text x="860" y="452" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" fill="#404040">拿去汇报或继续改。</text>
    <line x1="860" y1="512" x2="1180" y2="512" stroke="#D6E7F8" stroke-width="1"/>
    <text x="860" y="542" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#6B7280">文件名、格式和顺序都可控。</text>
  </g>

  <g id="takeaway">
    <text x="52" y="612" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="22" font-weight="bold" fill="#0D0D0D">同一次生成，不用二次整理。</text>
    <text x="430" y="612" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" fill="#6B7280">解决方案、PPT 大纲、导出文件，口径一致。</text>
  </g>

  <g id="footer">
    <rect x="0" y="656" width="1280" height="64" fill="#0070C0"/>
    <text x="52" y="694" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="18" fill="#FFFFFF">从客户材料到可交付文件，中间不再靠人补内容。</text>
    <text x="1228" y="694" text-anchor="end" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="12" fill="#FFFFFF" fill-opacity="0.8">08 / 10</text>
  </g>
</svg>
