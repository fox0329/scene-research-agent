    <text x="76" y="198" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="48" font-weight="bold" fill="#0070C0">6</text>
    <text x="132" y="184" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="23" font-weight="bold" fill="#1D2A8C">步分析</text>
    <text x="132" y="216" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="19" fill="#6B7280">从场景定义到交付物，一步不漏</text>

    <rect x="52" y="262" width="520" height="104" rx="10" fill="#F9FAFB" stroke="#D6E7F8" stroke-width="1"/>
    <rect x="52" y="262" width="5" height="104" rx="2" fill="#0070C0"/>
    <text x="76" y="318" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="48" font-weight="bold" fill="#0070C0">26</text>
    <text x="150" y="304" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="23" font-weight="bold" fill="#1D2A8C">张信息表</text>
    <text x="150" y="336" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="19" fill="#6B7280">结构化、可确认、可修改</text>

    <rect x="52" y="382" width="520" height="104" rx="10" fill="#F9FAFB" stroke="#D6E7F8" stroke-width="1"/>
    <rect x="52" y="382" width="5" height="104" rx="2" fill="#22943A"/>
    <text x="76" y="438" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="48" font-weight="bold" fill="#0070C0">2</text>
    <text x="110" y="424" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="23" font-weight="bold" fill="#1D2A8C">份产物</text>
    <text x="110" y="456" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="19" fill="#6B7280">解决方案 + PPT 大纲，同一次生成</text>
