  <g id="takeaway">
    <text x="52" y="566" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="22" font-weight="bold" fill="#0D0D0D">不是聊天框，是把售前调研做成可检查、可交付的工作流。</text>
    <text x="52" y="598" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="19" fill="#404040">每一步有表、有来源、有确认；最后收口成解决方案和 PPT 大纲。</text>
