<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="1280" height="720" viewBox="0 0 1280 720"><rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/><g id="kicker"><rect x="80" y="36" width="120" height="30" rx="15" fill="#E3F2FD"/><g id="kicker-icon"><use data-icon="tabler-outline/alert-triangle" x="92" y="40" width="22" height="22" fill="#0D47A1"/></g><text x="122" y="56.6" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" fill="#1565C0" font-weight="bold">现场断层</text></g><g id="hd"><text x="80" y="98" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="36" fill="#0D47A1" font-weight="bold">设备数据出不了机台</text><g id="page-no"><rect x="1045.8" y="42" width="154.19999999999996" height="24" rx="12" fill="#E3F2FD"/><text x="1188" y="59.25" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="15" fill="#1565C0" text-anchor="end">第 1 页 / 共 9 页</text></g></g><g id="subtitle"><text x="80" y="132" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18" fill="#5A7395">四类断层让 OEE 只能靠人工估算</text></g><g id="chip-1"><rect x="822.72" y="113" width="88" height="26" rx="13" fill="#E3F2FD"/><text x="834.72" y="131.6" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" fill="#1565C0">旁路改造</text></g><g id="chip-2"><rect x="918.72" y="113" width="89.28" height="26" rx="13" fill="#E3F2FD"/><text x="930.72" y="131.6" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" fill="#1565C0">不改 PLC</text></g><g id="chip-3"><rect x="1016" y="113" width="104" height="26" rx="13" fill="#E3F2FD"/><text x="1028" y="131.6" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" fill="#1565C0">按班次计量</text></g><g id="chip-4"><rect x="1128" y="113" width="72" height="26" rx="13" fill="#E3F2FD"/><text x="1140" y="131.6" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" fill="#1565C0">可追溯</text></g><g id="body"><g id="block-1"><rect x="80" y="170" width="550" height="216" rx="10" fill="#F7FAFE" stroke="#E3F2FD" stroke-width="1.5"/><rect x="80" y="170" width="550" height="34" rx="10" fill="#E3F2FD"/><rect x="80" y="194" width="550" height="10" rx="0" fill="#E3F2FD"/><rect x="80" y="178" width="5" height="200" rx="2.5" fill="#0D47A1"/><g id="block-1-icon"><use data-icon="tabler-outline/plug" x="92" y="173" width="28" height="28" fill="#0D47A1"/></g><text x="130" y="194" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="20" fill="#0D47A1" font-weight="bold">数据入口是断的</text><text x="130" y="222" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" fill="#5A7395">设备能动作，数据出不来</text><g id="block-1-line-1"><rect x="112" y="249" width="6" height="6" rx="1" fill="#90CAF9"/><g id="block-1-line-1-text"><text x="130" y="258" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" fill="#37474F"><tspan font-size="22" fill="#FF9800" font-weight="bold">28 台</tspan>压铸机靠班末人工抄录</text></g></g><g id="block-1-line-2"><rect x="112" y="279" width="6" height="6" rx="1" fill="#90CAF9"/><g id="block-1-line-2-text"><text x="130" y="288" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" fill="#37474F"><tspan font-size="20" fill="#0D47A1" font-weight="bold">产量次日汇总</tspan>，口径不统一</text></g></g><g id="block-1-line-3"><rect x="112" y="309" width="6" height="6" rx="1" fill="#90CAF9"/><g id="block-1-line-3-text"><text x="130" y="318" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" fill="#37474F">没有停机时长与节拍实测</text></g></g></g><g id="block-2"><rect x="650" y="170" width="550" height="216" rx="10" fill="#F7FAFE" stroke="#E3F2FD" stroke-width="1.5"/><rect x="650" y="170" width="550" height="34" rx="10" fill="#E3F2FD"/><rect x="650" y="194" width="550" height="10" rx="0" fill="#E3F2FD"/><rect x="650" y="178" width="5" height="200" rx="2.5" fill="#1565C0"/><g id="block-2-icon"><use data-icon="tabler-outline/activity" x="662" y="173" width="28" height="28" fill="#0D47A1"/></g><text x="700" y="194" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="20" fill="#0D47A1" font-weight="bold">停机归因不完整</text><text x="700" y="222" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" fill="#5A7395">停多久、为什么停说不清</text><g id="block-2-line-1"><rect x="682" y="249" width="6" height="6" rx="1" fill="#90CAF9"/><g id="block-2-line-1-text"><text x="700" y="258" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" fill="#37474F">停机只分故障与计划两类</text></g></g><g id="block-2-line-2"><rect x="682" y="279" width="6" height="6" rx="1" fill="#90CAF9"/><g id="block-2-line-2-text"><text x="700" y="288" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" fill="#37474F">换模待料与其他混在一起</text></g></g><g id="block-2-line-3"><rect x="682" y="309" width="6" height="6" rx="1" fill="#90CAF9"/><g id="block-2-line-3-text"><text x="700" y="318" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" fill="#37474F">损失无法按机台拆分</text></g></g></g><g id="block-3"><rect x="80" y="400" width="550" height="216" rx="10" fill="#F7FAFE" stroke="#E3F2FD" stroke-width="1.5"/><rect x="80" y="400" width="550" height="34" rx="10" fill="#E3F2FD"/><rect x="80" y="424" width="550" height="10" rx="0" fill="#E3F2FD"/><rect x="80" y="408" width="5" height="200" rx="2.5" fill="#42A5F5"/><g id="block-3-icon"><use data-icon="tabler-outline/file-text" x="92" y="403" width="28" height="28" fill="#0D47A1"/></g><text x="130" y="424" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="20" fill="#0D47A1" font-weight="bold">关键参数散落各处</text><text x="130" y="452" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" fill="#5A7395">参数留在控制器与纸卡上</text><g id="block-3-line-1"><rect x="112" y="479" width="6" height="6" rx="1" fill="#90CAF9"/><g id="block-3-line-1-text"><text x="130" y="488" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" fill="#37474F">压射速度与模温留在设备侧</text></g></g><g id="block-3-line-2"><rect x="112" y="509" width="6" height="6" rx="1" fill="#90CAF9"/><g id="block-3-line-2-text"><text x="130" y="518" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" fill="#37474F">纸质工艺卡难以追溯</text></g></g><g id="block-3-line-3"><rect x="112" y="539" width="6" height="6" rx="1" fill="#90CAF9"/><g id="block-3-line-3-text"><text x="130" y="548" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" fill="#37474F">客户审核一次要翻一整天</text></g></g></g><g id="block-4"><rect x="650" y="400" width="550" height="216" rx="10" fill="#F7FAFE" stroke="#E3F2FD" stroke-width="1.5"/><rect x="650" y="400" width="550" height="34" rx="10" fill="#E3F2FD"/><rect x="650" y="424" width="550" height="10" rx="0" fill="#E3F2FD"/><rect x="650" y="408" width="5" height="200" rx="2.5" fill="#FF9800"/><g id="block-4-icon"><use data-icon="tabler-outline/clock" x="662" y="403" width="28" height="28" fill="#0D47A1"/></g><text x="700" y="424" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="20" fill="#0D47A1" font-weight="bold">改造窗口极短</text><text x="700" y="452" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" fill="#5A7395">不许动原 PLC 与机械结构</text><g id="block-4-line-1"><rect x="682" y="479" width="6" height="6" rx="1" fill="#90CAF9"/><g id="block-4-line-1-text"><text x="700" y="488" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" fill="#37474F">老机控制器协议不开放</text></g></g><g id="block-4-line-2"><rect x="682" y="509" width="6" height="6" rx="1" fill="#90CAF9"/><g id="block-4-line-2-text"><text x="700" y="518" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" fill="#37474F">只能在周末停线窗口施工</text></g></g><g id="block-4-line-3"><rect x="682" y="539" width="6" height="6" rx="1" fill="#90CAF9"/><g id="block-4-line-3-text"><text x="700" y="548" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" fill="#37474F">单次窗口不超过 <tspan font-size="22" fill="#FF9800" font-weight="bold">8 小时</tspan></text></g></g></g><g id="grid-rules"><line x1="640" y1="174" x2="640" y2="616" stroke="#D6E7F8" stroke-width="1"/><line x1="84" y1="393" x2="1196" y2="393" stroke="#D6E7F8" stroke-width="1"/></g></g><g id="highlight"><rect x="80" y="634" width="1120" height="50" rx="10" fill="#E3F2FD"/><rect x="90" y="644" width="6" height="30" rx="3" fill="#FF9800"/><g id="highlight-icon"><use data-icon="tabler-outline/bulb" x="104" y="648" width="22" height="22" fill="#0D47A1"/></g><text x="136" y="666" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="19" fill="#0D47A1" font-weight="bold">数据入口不补上，OEE 永远是估算值</text></g><g id="footer"><text x="80" y="700" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="15" fill="#90CAF9">云枢智控 产品介绍</text></g></svg>