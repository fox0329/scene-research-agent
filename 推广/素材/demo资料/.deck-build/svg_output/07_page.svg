<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="1280" height="720" viewBox="0 0 1280 720"><rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/><g id="kicker"><rect x="80" y="36" width="120" height="30" rx="15" fill="#E3F2FD"/><g id="kicker-icon"><use data-icon="tabler-outline/shield-check" x="92" y="40" width="22" height="22" fill="#0D47A1"/></g><text x="122" y="56.6" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" fill="#1565C0" font-weight="bold">能力边界</text></g><g id="hd"><text x="80" y="98" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="36" fill="#0D47A1" font-weight="bold">这些事我们不做</text><g id="page-no"><rect x="1045.8" y="42" width="154.19999999999996" height="24" rx="12" fill="#E3F2FD"/><text x="1188" y="59.25" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="15" fill="#1565C0" text-anchor="end">第 7 页 / 共 9 页</text></g></g><g id="subtitle"><text x="80" y="132" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18" fill="#5A7395">提前说清楚，比实施期才发现好</text></g><g id="chip-1"><rect x="1016" y="113" width="88" height="26" rx="13" fill="#E3F2FD"/><text x="1028" y="131.6" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" fill="#1565C0">只做数据</text></g><g id="chip-2"><rect x="1112" y="113" width="88" height="26" rx="13" fill="#E3F2FD"/><text x="1124" y="131.6" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" fill="#1565C0">边界清晰</text></g><g id="body"><g id="item-1"><rect x="80" y="170" width="1120" height="65" rx="10" fill="#F7FAFE" stroke="#E3F2FD" stroke-width="1.5"/><g id="item-1-icon"><use data-icon="tabler-outline/shield-check" x="102" y="191.5" width="22" height="22" fill="#0D47A1"/></g><rect x="138" y="180.5" width="44" height="44" rx="10" fill="#E3F2FD"/><text x="160" y="209.5" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="20" fill="#1565C0" font-weight="bold" text-a