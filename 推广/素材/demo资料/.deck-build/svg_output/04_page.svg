<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="1280" height="720" viewBox="0 0 1280 720"><rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/><g id="kicker"><rect x="80" y="36" width="136" height="30" rx="15" fill="#E3F2FD"/><g id="kicker-icon"><use data-icon="tabler-outline/cpu" x="92" y="40" width="22" height="22" fill="#0D47A1"/></g><text x="122" y="56.6" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" fill="#1565C0" font-weight="bold">边缘控制器</text></g><g id="hd"><text x="80" y="98" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="36" fill="#0D47A1" font-weight="bold">EC3200 与 EC5200 别选错</text><g id="page-no"><rect x="1045.8" y="42" width="154.19999999999996" height="24" rx="12" fill="#E3F2FD"/><text x="1188" y="59.25" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="15" fill="#1565C0" text-anchor="end">第 4 页 / 共 9 页</text></g></g><g id="subtitle"><text x="80" y="132" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18" fill="#5A7395">看机台数量，也看要不要在现场推理</text></g><g id="chip-1"><rect x="948.8" y="113" width="88" height="26" rx="13" fill="#E3F2FD"/><text x="960.8" y="131.6" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" fill="#1565C0">旁路采集</text></g><g id="chip-2"><rect x="1044.8" y="113" width="73.28" height="26" rx="13" fill="#E3F2FD"/><text x="1056.8" y="131.6" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" fill="#1565C0">软 PLC</text></g><g id="chip-3"><rect x="1126.08" y="113" width="73.92" height="26" rx="13" fill="#E3F2FD"/><text x="1138.08" y="131.6" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" fill="#1565C0">6 TOPS</text></g><g id="body"><g id="col-1"><rect x="80" y="170" width="550" height="450" rx="10" fill="#F7FAFE" stroke="#E3F2FD" stroke-width="1.5"/><rect x="80" y="170" width="550" height="52" rx="10" fill="#0D47A1"/><rect x="80" y="212" width="550" height="10" rx="0" fill="#0D47A1"/><g id="col-1-icon"><use data-icon="tabler-outline/device-desktop" x="100" y="183" width="26" height="26" fill="#FFFFFF"/></g><text x="138" y="204" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="20" fill="#FFFFFF" font-weight="bold">YS-EC3200 紧凑型</text><text x="138" y="246" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" fill="#5A7395">单机台、单工位的标准件</text><g id="col-1-line-1"><rect x="120" y="265" width="6" height="6" rx="1" fill="#90CAF9"/><g id="col-1-line-1-text"><text x="138" y="274" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" fill="#37474F"><tspan font-size="22" fill="#FF9800" font-weight="bold">4</tspan> 核 Cortex-A55 @1.8GHz</text></g></g><g id="col-1-line-2"><rect x="120" y="297" width="6" height="6" rx="1" fill="#90CAF9"/><g id="col-1-line-2-text"><text x="138" y="306" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" fill="#37474F"><tspan font-size="22" fill="#FF9800" font-weight="bold">1</tspan>GB 内存 / 8GB 存储</text></g></g><g id="col-1-line-3"><rect x="120" y="329" width="6" height="6" rx="1" fill="#90CAF9"/><g id="col-1-line-3-text"><text x="138" y="338" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" fill="#37474F"><tspan font-size="20" fill="#0D47A1" font-weight="bold">2×RS485</tspan>、<tspan font-size="22" fill="#FF9800" font-weight="bold">1</tspan>×CAN 接入</text></g></g><g id="col-1-line-4"><rect x="120" y="361" width="6" height="6" rx="1" fill="#90CAF9"/><g id="col-1-line-4-text"><text x="138" y="370" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" fill="#37474F"><tspan font-size="20" fill="#0D47A1" font-weight="bold">6W 功耗</tspan>，DIN<tspan font-size="22" fill="#FF9800" font-weight="bold">35</tspan> 导轨安装</text></g></g><g id="col-1-line-5"><rect x="120" y="393" width="6" height="6" rx="1" fill="#90CAF9"/><g id="col-1-line-5-text"><text x="138" y="402" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" fill="#37474F"><tspan font-size="20" fill="#0D47A1" font-weight="bold">无 NPU</tspan>，不承担推理</text></g></g></g><g id="col-2"><rect x="650" y="170" width="550" height="450" rx="10" fill="#F7FAFE" stroke="#E3F2FD" stroke-width="1.5"/><rect x="650" y="170" width="550" height="52" rx="10" fill="#1565C0"/><rect x="650" y="212" width="550" height="10" rx="0" fill="#1565C0"/><g id="col-2-icon"><use data-icon="tabler-outline/server" x="670" y="183" width="26" height="26" fill="#FFFFFF"/></g><text x="708" y="204" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="20" fill="#FFFFFF" font-weight="bold">YS-EC5200 高性能</text><text x="708" y="246" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" fill="#5A7395">多机汇聚加边缘 AI 推理</text><g id="col-2-line-1"><rect x="690" y="265" width="6" height="6" rx="1" fill="#90CAF9"/><g id="col-2-line-1-text"><text x="708" y="274" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" fill="#37474F"><tspan font-size="22" fill="#FF9800" font-weight="bold">8</tspan> 核 @2.4GHz，4GB 内存</text></g></g><g id="col-2-line-2"><rect x="690" y="297" width="6" height="6" rx="1" fill="#90CAF9"/><g id="col-2-line-2-text"><text x="708" y="306" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" fill="#37474F">NPU <tspan font-size="22" fill="#FF9800" font-weight="bold">6</tspan> TOPS，可做缺陷检测</text></g></g><g id="col-2-line-3"><rect x="690" y="329" width="6" height="6" rx="1" fill="#90CAF9"/><g id="col-2-line-3-text"><text x="708" y="338" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" fill="#37474F"><tspan font-size="20" fill="#0D47A1" font-weight="bold">4×RS485</tspan>、<tspan font-size="22" fill="#FF9800" font-weight="bold">2</tspan>×CAN 接入</text></g></g><g id="col-2-line-4"><rect x="690" y="361" width="6" height="6" rx="1" fill="#90CAF9"/><g id="col-2-line-4-text"><text x="708" y="370" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" fill="#37474F"><tspan font-size="20" fill="#0D47A1" font-weight="bold">4×千兆网口</tspan>、<tspan font-size="22" fill="#FF9800" font-weight="bold">2</tspan>×SFP 光口</text></g></g><g id="col-2-line-5"><rect x="690" y="393" width="6" height="6" rx="1" fill="#90CAF9"/><g id="col-2-line-5-text"><text x="708" y="402" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" fill="#37474F">软 PLC 支持 IEC <tspan font-size="22" fill="#FF9800" font-weight="bold">61131</tspan>-3</text></g></g></g><g id="col-rules"><line x1="640" y1="174" x2="640" y2="616" stroke="#D6E7F8" stroke-width="1"/></g></g><g id="highlight"><rect x="80" y="634" width="1120" height="50" rx="10" fill="#E3F2FD"/><rect x="90" y="644" width="6" height="30" rx="3" fill="#FF9800"/><g id="highlight-icon"><use data-icon="tabler-outline/bulb" x="104" y="648" width="22" height="22" fill="#0D47A1"/></g><text x="136" y="666" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="19" fill="#0D47A1" font-weight="bold">一个工位多台设备就别拿 EC3200 硬拼</text></g><g id="footer"><text x="80" y="700" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="15" fill="#90CAF9">云枢智控 产品介绍</text></g></svg>