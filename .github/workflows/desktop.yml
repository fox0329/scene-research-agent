# 桌面版构建（GitHub Actions）：mac / win 各自机器上出包，附到 Release
#
# 为什么必须在各自平台构建、而不是在 mac 上一把出两个平台：
#   electron-builder 在 mac 上出 Windows 包要借 Wine 一类工具链，装出来的东西自己没法验；
#   这里用矩阵各自构建，并且**每个平台都跑一遍桌面壳冒烟**（真启动应用、真拉本地服务），
#   不是"打完包就算完"。
#
# 触发：推 tag（v*）→ 出包并创建/更新 Release；也可手动 workflow_dispatch 只留 artifacts。
name: desktop

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 每个架构必须在自己的机器上构建并冒烟：
          # 运行时里的 better-sqlite3 是**架构相关**的，在 arm64 上交叉打出 x64 包，
          # 塞进去的仍是 arm64 原生模块，用户一跑就崩（2026-10-12 真实踩过）。
          #
          # 2026-10-15 用户定调：**不再支持 macOS Intel（x64）**——只出 Apple 芯片 dmg。
          # 顺带解决 macos-13 被 GitHub 逐步下线、排队动辄半小时以上的问题（变更表 #200）。
          - os: macos-14 # Apple Silicon
            target: mac
            arch: arm64
          - os: windows-latest
            target: win
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # better-sqlite3 是原生模块，Windows 上要从源码编译（runner 自带 VS Build Tools），
      # mac 上自带 Xcode CLT；这里显式装好 python-setuptools 让 node-gyp 稳一点。
      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 全量构建（契约/领域/基础设施/服务端/前端）
        run: pnpm build

      # 不用 `pnpm test`：它前置的 clean:stray 依赖 GNU find，Windows runner 上没有。
      # CI 是干净检出，本来就没有杂散编译产物，直接跑 vitest 等价。
      - name: 单测（构建产物与契约的回归）
        run: pnpm exec vitest run

      - name: 装配桌面版运行时（含按 Electron ABI 重建 better-sqlite3）
        run: node apps/desktop/scripts/prepare-server.mjs --arch=${{ matrix.arch }}

      - name: 解包 Windows 内置 PPT 组件
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force apps/desktop/ppt-runtime -ErrorAction SilentlyContinue
          Expand-Archive -Path apps/desktop/assets/ppt-runtime-win.zip -DestinationPath apps/desktop/ppt-runtime -Force
          Test-Path apps/desktop/ppt-runtime/python/python.exe
          Test-Path apps/desktop/ppt-runtime/skill/scripts/svg_to_pptx.py
          & apps/desktop/ppt-runtime/python/python.exe -c "import sys, pptx; print('PPT runtime', sys.version.split()[0], pptx.__version__)"
          & apps/desktop/ppt-runtime/python/python.exe apps/desktop/ppt-runtime/skill/scripts/svg_to_pptx.py apps/desktop/assets/ppt-smoke -o "$env:TEMP\ppt-smoke.pptx" --no-compat -f ppt169
          if (-not (Test-Path "$env:TEMP\ppt-smoke.pptx")) { throw "PPT 组件转档自检失败" }

      - name: 编译桌面壳（冒烟依赖 dist/main.cjs）
        run: pnpm --filter @scene/desktop run build:shell

      - name: 桌面壳冒烟（真启动应用 + 真拉本地服务）
        run: node apps/desktop/scripts/smoke.mjs

      - name: 先出未压缩应用目录，并对**打包产物**跑冒烟 + 验「应用内配置模型」
        run: |
          pnpm --filter @scene/desktop run pack:dir
          node apps/desktop/scripts/smoke-packaged.mjs
          node apps/desktop/scripts/verify-settings.mjs
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: 打包
        run: pnpm --filter @scene/desktop run pack:${{ matrix.target }}:${{ matrix.arch }}
        env:
          # 免签名：不让 electron-builder 去找证书，也就不会因缺证书失败
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      # 直接挂 Release，不走 Actions artifacts：
      # GitHub 的 artifact 存储有账号级配额，2026-10-23 实测被历史产物占满后
      # 两个平台都卡在“上传产物”一步（构建本身是成功的）。Release 资产不受该配额限制。
      - name: 挂到 Release（tag 构建）
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$GITHUB_REF_NAME"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "场景通 $TAG" --notes-file .github/release-notes.md || true
          VER="${TAG#v}"
          mkdir -p out
          for f in apps/desktop/release/*.dmg apps/desktop/release/*.exe; do
            [ -e "$f" ] || continue
            b="$(basename "$f")"
            case "$b" in
              *mac-arm64.dmg)        n="SceneMaster-$VER-mac-arm64.dmg" ;;
              *win-x64-安装版.exe)   n="SceneMaster-$VER-win-x64-setup.exe" ;;
              *)                     n="$b" ;;
            esac
            cp "$f" "out/$n"
            echo "$b  →  $n"
          done
          # 注意：校验和**不在这里生成**——两平台 job 并行，各自只算得到自己的产物，
          # 后上传的会覆盖先上传的（v0.9.7 首次发布真实踩过：SHA256SUMS 只剩 win 一行）。
          # 汇总由下面单独的 checksums job 在两平台都上传完之后做。
          for f in out/*; do
            for attempt in 1 2 3 4 5; do
              if gh release upload "$TAG" "$f" --clobber; then break; fi
              [ "$attempt" = "5" ] && { echo "::error::上传失败：$f"; exit 1; }
              sleep 5
            done
          done

  # 校验和汇总（发布检查单要求）：必须等两平台产物都挂上再算，
  # 否则每个 job 只算得到自己的那份，互相覆盖（v0.9.7 首次发布踩过）。
  # 用 GitHub 记录的 asset digest，不重复下载几百 MB。
  checksums:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: 生成并上传 SHA256SUMS.txt
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          mkdir -p out
          gh api "repos/${{ github.repository }}/releases/tags/$TAG" \
            --jq '.assets[] | select(.name != "SHA256SUMS.txt") | select(.digest != null) | "\(.digest | sub("sha256:"; "")) *\(.name)"' \
            > out/SHA256SUMS.txt
          # 兜底：digest 字段不可用（老 gh/企业版）时下载资产本地计算
          if [ ! -s out/SHA256SUMS.txt ]; then
            gh release download "$TAG" --dir dl --pattern "*.dmg" --pattern "*.exe"
            (cd dl && sha256sum * > ../out/SHA256SUMS.txt)
          fi
          echo "—— 汇总结果 ——"
          cat out/SHA256SUMS.txt
          # 用 awk 数非空行：jq 重定向时末行可能不带换行，wc -l 会少数一行（v0.9.26 真实踩过，
          # 明明 2 行被判成 1 行、整个 job 失败）
          LINES=$(awk 'NF{n++} END{print n+0}' out/SHA256SUMS.txt)
          if [ "$LINES" -lt 2 ]; then
            echo "::error::校验和只有 $LINES 行，两平台产物应各一行"
            exit 1
          fi
          gh release upload "$TAG" out/SHA256SUMS.txt --clobber
