# 桌面版构建（GitHub Actions）：mac / win 各自机器上出包，附到 Release
#
# 为什么必须在各自平台构建、而不是在 mac 上一把出两个平台：
#   electron-builder 在 mac 上出 Windows 包要借 Wine 一类工具链，装出来的东西自己没法验；
#   这里用矩阵各自构建，并且**每个平台都跑一遍桌面壳冒烟**（真启动应用、真拉本地服务），
#   不是"打完包就算完"。
#
# 触发：推 tag（v*）→ 出包并创建/更新 Release；也可手动 workflow_dispatch 只留 artifacts。
name: desktop

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 每个架构必须在自己的机器上构建并冒烟：
          # 运行时里的 better-sqlite3 是**架构相关**的，在 arm64 上交叉打出 x64 包，
          # 塞进去的仍是 arm64 原生模块，用户一跑就崩（2026-10-12 真实踩过）。
          #
          # 2026-10-15 用户定调：**不再支持 macOS Intel（x64）**——只出 Apple 芯片 dmg。
          # 顺带解决 macos-13 被 GitHub 逐步下线、排队动辄半小时以上的问题（变更表 #200）。
          - os: macos-14 # Apple Silicon
            target: mac
            arch: arm64
          - os: windows-latest
            target: win
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # better-sqlite3 是原生模块，Windows 上要从源码编译（runner 自带 VS Build Tools），
      # mac 上自带 Xcode CLT；这里显式装好 python-setuptools 让 node-gyp 稳一点。
      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 全量构建（契约/领域/基础设施/服务端/前端）
        run: pnpm build

      # 不用 `pnpm test`：它前置的 clean:stray 依赖 GNU find，Windows runner 上没有。
      # CI 是干净检出，本来就没有杂散编译产物，直接跑 vitest 等价。
      - name: 单测（构建产物与契约的回归）
        run: pnpm exec vitest run

      - name: 装配桌面版运行时（含按 Electron ABI 重建 better-sqlite3）
        run: node apps/desktop/scripts/prepare-server.mjs --arch=${{ matrix.arch }}

      - name: 编译桌面壳（冒烟依赖 dist/main.cjs）
        run: pnpm --filter @scene/desktop run build:shell

      - name: 桌面壳冒烟（真启动应用 + 真拉本地服务）
        run: node apps/desktop/scripts/smoke.mjs

      - name: 先出未压缩应用目录，并对**打包产物**跑冒烟 + 验「应用内配置模型」
        run: |
          pnpm --filter @scene/desktop run pack:dir
          node apps/desktop/scripts/smoke-packaged.mjs
          node apps/desktop/scripts/verify-settings.mjs
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: 打包
        run: pnpm --filter @scene/desktop run pack:${{ matrix.target }}:${{ matrix.arch }}
        env:
          # 免签名：不让 electron-builder 去找证书，也就不会因缺证书失败
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: 上传产物（构建记录里可下载）
        uses: actions/upload-artifact@v4
        with:
          name: 场景通-${{ matrix.target }}-${{ matrix.arch }}-${{ github.run_number }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.exe
          if-no-files-found: error

  # 单独一个发布任务：**发布只有一个写入者**。
  # 为什么必须拆出来：之前两个平台各自 softprops/action-gh-release 同时写同一个 Release，
  # 苹果那路先建好、Windows 这路再写就撞车失败（2026-10-15 真机：包传上去了、步骤报失败）。
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      # 必须放在最前面：actions/checkout 默认执行 `git clean -ffdx`，
      # 放在下载产物之后就等于把 dist/ 清空（2026-10-15 真机：上传时 no matches found）
      - name: 取回仓库文件（发布说明与脚本）
        uses: actions/checkout@v4

      - name: 取回各平台产物
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 核对产物齐了（Apple 芯片 dmg + Windows exe）
        run: |
          ls -l dist
          test -n "$(ls dist/*.dmg 2>/dev/null)" || { echo "缺 macOS dmg"; exit 1; }
          test -n "$(ls dist/*.exe 2>/dev/null)" || { echo "缺 Windows exe"; exit 1; }

      - name: 产物改名为 ASCII（GitHub 资产名不允许非 ASCII）
        run: |
          # GitHub 会把资产名里的非 ASCII 字符剥掉：两个中文名不同的 Windows 包
          # （安装版/免安装版）会变成同一个 `-0.2.1-win-x64-.exe`，第二个必然上传失败
          # （2026-10-15 真机连续三轮 404/422，故障清单 #79）。
          # 所以发布前统一改成 ASCII 名；中文信息留在 Release 标题与说明里。
          VER="${GITHUB_REF_NAME#v}"
          mkdir -p out
          for f in dist/*; do
            b="$(basename "$f")"
            case "$b" in
              *mac-arm64.dmg)        n="SceneMaster-$VER-mac-arm64.dmg" ;;
              *win-x64-安装版.exe)   n="SceneMaster-$VER-win-x64-setup.exe" ;;
              *win-x64-免安装版.exe) n="SceneMaster-$VER-win-x64-portable.exe" ;;
              *win-x64.exe)          n="SceneMaster-$VER-win-x64.exe" ;;
              *)                     n="$b" ;;
            esac
            cp "$f" "out/$n"
            echo "$b  →  $n"
          done
          ls -l out

      - name: 挂到 Release（逐文件重试，抵御瞬时失败）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$GITHUB_REF_NAME"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在 → 直接覆盖产物"
          else
            gh release create "$TAG" --title "场景通 $TAG" --notes-file .github/release-notes.md
          fi
          for f in out/*; do
            for attempt in 1 2 3 4 5; do
              if gh release upload "$TAG" "$f" --clobber; then
                echo "✅ $(basename "$f")"
                break
              fi
              if [ "$attempt" = "5" ]; then
                echo "::error::上传失败（已重试 5 次）：$f"
                exit 1
              fi
              echo "… 第 $attempt 次失败，5 秒后重试：$(basename "$f")"
              sleep 5
            done
          done
          echo "── 最终核对：Release 上的产物 ──"
          gh release view "$TAG" --json assets --jq '.assets[] | "\(.name)  \(.size)"'
